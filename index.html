<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tito · Face ID</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #111111);
    --muted: var(--tg-theme-hint-color, #777777);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-fg: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --danger: var(--tg-theme-destructive-text-color, #d93025);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 16px; background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; gap: 18px;
  }
  h1 { font-size: 22px; margin: 0; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; }
  .code { font: 600 28px/1 ui-monospace, Menlo, monospace; letter-spacing: 4px; text-align: center; padding: 6px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  button {
    width: 100%; border: 0; border-radius: 12px; padding: 15px; font: 600 17px/1 inherit;
    background: var(--btn); color: var(--btn-fg); cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--danger); }
  button:disabled { opacity: .5; }
  #status { min-height: 1.4em; text-align: center; }
  #status.err { color: var(--danger); }
</style>
</head>
<body>
  <h1 id="title">Tito</h1>
  <div class="card" id="info"></div>
  <div id="status" class="muted"></div>
  <button id="go" disabled>…</button>
  <button id="no" class="secondary" hidden>Rechazar</button>

<script>
// Face ID approvals for the Tito Telegram bot. Holds no secrets: the signing
// key lives in the phone's secure storage (Telegram BiometricManager) and is
// released only after Face ID. Only the public key ever leaves the phone.
const tg = window.Telegram.WebApp
const bm = tg.BiometricManager
const q = new URLSearchParams(location.search)
const mode = q.get('m')          // 'enroll' | 'approve'
const nonce = q.get('n') || ''
const code = (q.get('c') || '').replace(/[^A-Z0-9]/g, '')
const $ = (id) => document.getElementById(id)
const status = (t, err) => { $('status').textContent = t; $('status').className = err ? 'err' : 'muted' }

const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
const enc = (s) => new TextEncoder().encode(s)
const ALG = { name: 'ECDSA', namedCurve: 'P-256' }
const SIG = { name: 'ECDSA', hash: 'SHA-256' }

async function sign(privJwk, what) {
  const key = await crypto.subtle.importKey('jwk', privJwk, ALG, false, ['sign'])
  return b64u(await crypto.subtle.sign(SIG, key, enc(`tito|${what}|${nonce}`)))
}

const send = (obj) => tg.sendData(JSON.stringify(obj))   // closes the mini app

function ensureAccess() {
  return new Promise((resolve, reject) => {
    if (!bm.isBiometricAvailable) return reject(new Error('Este teléfono no tiene Face ID / Touch ID disponible para Telegram.'))
    if (bm.isAccessGranted) return resolve()
    bm.requestAccess({ reason: 'Tito usa Face ID para que solo vos puedas aprobar acciones en tu Mac.' }, (ok) =>
      ok ? resolve() : reject(new Error('No diste permiso de Face ID. Activalo en Ajustes de Telegram → Privacidad → Biometría.')))
  })
}

async function enroll() {
  $('go').disabled = true
  try {
    await ensureAccess()
    status('Generando la clave…')
    const pair = await crypto.subtle.generateKey(ALG, true, ['sign', 'verify'])
    const full = await crypto.subtle.exportKey('jwk', pair.privateKey)
    const priv = { kty: full.kty, crv: full.crv, x: full.x, y: full.y, d: full.d }
    const pub = { kty: full.kty, crv: full.crv, x: full.x, y: full.y }
    const saved = await new Promise((r) => bm.updateBiometricToken(JSON.stringify(priv), r))
    if (!saved) throw new Error('No se pudo guardar la clave en el teléfono.')
    send({ m: 'enroll', n: nonce, pub, sig: await sign(priv, 'enroll'), dev: bm.deviceId })
  } catch (e) { status(e.message, true); $('go').disabled = false }
}

async function approve() {
  $('go').disabled = true
  try {
    await ensureAccess()
    if (!bm.isBiometricTokenSaved) throw new Error('Este teléfono no está registrado. Corré enroll.sh en la Mac.')
    const token = await new Promise((resolve, reject) =>
      bm.authenticate({ reason: `Aprobar la acción ${code} de Tito` }, (ok, t) => ok && t ? resolve(t) : reject(new Error('Face ID cancelado.'))))
    send({ m: 'approve', n: nonce, sig: await sign(JSON.parse(token), 'approve') })
  } catch (e) { status(e.message, true); $('go').disabled = false }
}

function setup() {
  tg.ready(); tg.expand()
  if (!tg.isVersionAtLeast('7.2') || !bm) { status('Actualizá Telegram: esta versión no soporta Face ID en mini apps.', true); return }
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(nonce)) { status('Link inválido. Abrilo desde el botón del chat con Tito.', true); return }
  bm.init(() => {
    if (mode === 'enroll') {
      $('title').textContent = 'Registrar Face ID'
      $('info').innerHTML = 'Esto guarda en este teléfono una clave que solo se usa con tu cara. Después, cada acción delicada de Tito se aprueba desde acá.'
      $('go').textContent = 'Registrar con Face ID'
      $('go').onclick = enroll
    } else if (mode === 'approve') {
      $('title').textContent = 'Aprobar acción'
      $('info').innerHTML = `<div class="code">${code}</div><div class="muted" style="text-align:center">Fijate que coincida con el código del mensaje en el chat.</div>`
      $('go').textContent = 'Aprobar con Face ID'
      $('go').onclick = approve
      $('no').hidden = false
      $('no').onclick = () => send({ m: 'deny', n: nonce })
    } else { status('Link inválido.', true); return }
    $('go').disabled = false
  })
}
setup()
</script>
</body>
</html>
